<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="todo-shell">
    <section class="todo-card" aria-labelledby="page-title">
      <header class="todo-header">
        <p class="eyebrow">今日清單</p>
        <div class="title-row">
          <h1 id="page-title">To-Do List</h1>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
            <span class="theme-icon" aria-hidden="true">🌙</span>
            <span class="theme-label">Dark mode</span>
          </button>
        </div>
        <p class="subtitle">把想完成的事，一件一件放進今天。</p>
      </header>

      <form class="todo-form" id="todo-form">
        <label class="sr-only" for="todo-input">新增待辦事項</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="例如：完成專案簡報"
          autocomplete="off"
          maxlength="120"
        >
        <button type="submit">Add</button>
      </form>

      <p class="form-message" id="form-message" role="status" aria-live="polite"></p>

      <nav class="filters" aria-label="待辦事項篩選">
        <button class="filter-button is-selected" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </nav>

      <div class="todo-list" id="todo-list" aria-live="polite"></div>

      <footer class="todo-footer">
        <span id="remaining-count">Remaining: 0</span>
        <button class="clear-button" id="clear-completed" type="button">清除已完成</button>
      </footer>
    </section>
  </main>
</body>
</html>
