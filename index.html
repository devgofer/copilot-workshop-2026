<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="todo-shell">
    <section class="todo-card" aria-labelledby="page-title">
      <header class="todo-header">
        <p class="eyebrow">今日清單</p>
        <h1 id="page-title">To-Do List</h1>
        <p class="subtitle">把想完成的事，一件一件放進今天。</p>
      </header>

      <form class="todo-form" id="todo-form">
        <label class="sr-only" for="todo-input">新增待辦事項</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="例如：完成專案簡報"
          autocomplete="off"
          maxlength="120"
        >
        <button type="submit">Add</button>
      </form>

      <p class="form-message" id="form-message" role="status" aria-live="polite"></p>

      <div class="todo-list" id="todo-list" aria-live="polite"></div>

      <footer class="todo-footer">
        <span id="remaining-count">Remaining: 0</span>
        <button class="clear-button" id="clear-completed" type="button">清除已完成</button>
      </footer>
    </section>
  </main>
</body>
</html>
